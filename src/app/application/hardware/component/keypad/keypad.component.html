<div class="vertical-height">
  <button matMiniFab (click)="keyAction(keyPad.ACTION_LEFT)">
    <mat-icon fontIcon="menu"></mat-icon>
  </button>
  <button matMiniFab (click)="keyAction(keyPad.CALL)">
    <mat-icon fontIcon="call"></mat-icon>
  </button>
</div>

<div>
  <div class="d-pad">
    <button matMiniFab (click)="keyAction(keyPad.D_PAD_UP)">
      <mat-icon fontIcon="keyboard_arrow_up"></mat-icon>
    </button>
  </div>

  <div class="d-pad">
    <button matMiniFab (click)="keyAction(keyPad.D_PAD_LEFT)">
      <mat-icon fontIcon="keyboard_arrow_left"></mat-icon>
    </button>
    <button matFab (click)="keyAction(keyPad.D_PAD_CENTER)">
      <mat-icon fontIcon="filter_tilt_shift"></mat-icon>
    </button>
    <button matMiniFab (click)="keyAction(keyPad.D_PAD_RIGHT)">
      <mat-icon fontIcon="keyboard_arrow_right"></mat-icon>
    </button>
  </div>

  <div class="d-pad">
    <button matMiniFab (click)="keyAction(keyPad.D_PAD_DOWN)">
      <mat-icon fontIcon="keyboard_arrow_down"></mat-icon>
    </button>
  </div>
</div>

<div class="vertical-height">
  <button matMiniFab (click)="keyAction(keyPad.ACTION_RIGHT)">
    <mat-icon fontIcon="menu"></mat-icon>
  </button>
  <button matMiniFab (click)="keyAction(keyPad.CALL_DISCONNECT)">
    <mat-icon fontIcon="call_end"></mat-icon>
  </button>
</div>
