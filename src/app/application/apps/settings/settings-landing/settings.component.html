<mat-list *ngIf="currentSettingsList">
  <div mat-subheader>Folders</div>
  <mat-list-item *ngFor="let setting of currentSettingsList.children; let i=index"
    [ngClass]="{'active': getLastDepth() === i}">
    <mat-icon matListItemIcon>{{setting.icon}}</mat-icon>
    <div matListItemTitle>{{setting.title}}</div>
  </mat-list-item>
</mat-list>

<app-action-bar [actions]="actionBar"></app-action-bar>
