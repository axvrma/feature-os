<mat-list *ngIf="data && data?.length">
  <mat-list-item *ngFor="let element of data; let i=index" [ngClass]="{'active': currentRow === i}" [id]="i">
    <mat-icon matListItemIcon>{{element.icon}}</mat-icon>
    <span matListItemTitle>{{element.title}}</span>
    <span matListItemLine> asd {{element.subTitle}}</span>
  </mat-list-item>
</mat-list>
